<script>
(function () {
  var btn = document.querySelector('[data-menu-toggle]');
  var panel = document.querySelector('[data-mobile-panel]');
  if (!btn || !panel) return;
  var icon = btn.querySelector('i');
  var open = false;
  function setOpen(v) {
    open = v;
    panel.hidden = !v;
    if (icon) icon.className = v ? 'ph ph-x' : 'ph ph-list';
  }
  btn.addEventListener('click', function () {
    setOpen(!open);
  });
  // Closes on crossing the 720px breakpoint either direction, so a panel
  // left open narrow never lingers stale once the layout goes wide (where
  // CSS alone already hides it) or reappears stuck open if narrowed again.
  window.addEventListener('resize', function () {
    if (open) setOpen(false);
  });
})();
</script>
