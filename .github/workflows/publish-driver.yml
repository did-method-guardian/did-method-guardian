name: Publish Universal Resolver driver

# Builds the did:guardian Universal Resolver driver (packages/uni-resolver-driver)
# and pushes it to ghcr.io/did-method-guardian/driver-did-guardian. Runs on a
# v1.0.0 tag, or manually -- never on every push, since this publishes a
# public image. Needs no secrets beyond the built-in GITHUB_TOKEN
# (packages:write); the resulting package still has to be made public once
# by hand the first time it's pushed (GHCR defaults new packages to private).
on:
  push:
    tags:
      - "v1.0.0"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the driver against the live registrar first
        run: |
          npm ci --workspace=packages/lib --workspace=packages/uni-resolver-driver
          npm run build --workspace=packages/lib
          npm test --workspace=packages/uni-resolver-driver

      - uses: docker/setup-buildx-action@v3

      - name: Build the image, loaded locally (not pushed yet)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: packages/uni-resolver-driver/Dockerfile
          load: true
          push: false
          tags: driver-did-guardian:smoke-test

      - name: Smoke-test the built container against the live registrar
        run: |
          docker run -d --name driver-smoke-test -p 8172:8080 driver-did-guardian:smoke-test
          for i in $(seq 1 20); do
            curl -sf http://localhost:8172/1.0/identifiers/did:guardian:guardianspec.org > /tmp/smoke-response.json && break
            sleep 1
          done
          cat /tmp/smoke-response.json
          docker logs driver-smoke-test
          docker stop driver-smoke-test
          python3 -c "import json,sys; d=json.load(open('/tmp/smoke-response.json')); assert d['didDocument']['id']=='did:guardian:guardianspec.org', d; print('smoke test ok:', d['didDocument']['id'])"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push the already-built, already-smoke-tested image
        run: |
          docker tag driver-did-guardian:smoke-test ghcr.io/did-method-guardian/driver-did-guardian:1.0.0
          docker tag driver-did-guardian:smoke-test ghcr.io/did-method-guardian/driver-did-guardian:latest
          docker push ghcr.io/did-method-guardian/driver-did-guardian:1.0.0
          docker push ghcr.io/did-method-guardian/driver-did-guardian:latest
