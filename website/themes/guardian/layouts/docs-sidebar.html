<!doctype html>
<html lang='en'>
<head>
<meta ht-include='fragments/head.html'></meta>
</head>
<body>
<header ht-include='fragments/header.html'></header>
<div class='layout'>
<aside ht-include='fragments/docs-nav.html'></aside>
<main class='content'>
<article class='prose' ht-content='markdown:page.content'></article>
</main>
<aside class='toc-sidebar'><p class='toc-label'>On this page</p><nav id='TableOfContents'></nav></aside>
</div>
<footer ht-include='fragments/footer.html'></footer>
<script>
(function () {
  // Marks the current page's own link active in the left page-nav (just
  // the highlight, no nesting -- a page's own heading count can be large
  // enough to push every other page out of view, confirmed live). The
  // heading outline itself goes in the right-hand "on this page" column
  // instead, the near-universal docs-site pattern (Stripe, MDN, Tailwind,
  // GitHub Docs, Vercel).
  var path = window.location.pathname;
  if (!path.endsWith('/')) path = path + '/';
  document.querySelectorAll('.sidenav > a.navlink').forEach(function (a) {
    var href = a.getAttribute('href');
    if (!href.endsWith('/')) href = href + '/';
    if (href === path) a.classList.add('active');
  });

  var article = document.querySelector('article.prose');
  var toc = document.getElementById('TableOfContents');
  var tocSidebar = document.querySelector('.toc-sidebar');
  if (!article || !toc) return;
  var headings = article.querySelectorAll('h2, h3');
  if (headings.length < 2) {
    if (tocSidebar) tocSidebar.hidden = true;
    return;
  }
  var list = document.createElement('ul');
  list.className = 'toc';
  var linkByHeadingId = {};
  headings.forEach(function (h) {
    if (!h.id) return;
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent.replace(/#$/, '').trim();
    li.appendChild(a);
    list.appendChild(li);
    linkByHeadingId[h.id] = a;
  });
  toc.appendChild(list);

  // Scroll-syncs the "on this page" list -- the active heading is the
  // last one (in document order) whose own top edge has scrolled above a
  // fixed line near the top of the viewport. An IntersectionObserver keyed
  // on "is this heading within the top N% of the viewport" sounds like
  // the obvious tool here, but it isn't: a long section's own heading
  // spends almost its whole scroll life in the MIDDLE of the viewport, so
  // the "visible" set is empty most of the time and nothing ever gets
  // marked active -- confirmed live, not a theoretical concern. Plain
  // scroll-position math has no such gap.
  var activeLink = null;
  function setActive(id) {
    var next = id ? linkByHeadingId[id] : null;
    if (next === activeLink) return;
    if (activeLink) activeLink.classList.remove('active');
    if (next) next.classList.add('active');
    activeLink = next || null;
  }
  var TRIGGER_LINE_PX = 120;
  var ticking = false;
  function updateActive() {
    ticking = false;
    var current = null;
    for (var i = 0; i < headings.length; i++) {
      if (headings[i].getBoundingClientRect().top <= TRIGGER_LINE_PX) current = headings[i].id;
      else break;
    }
    setActive(current || headings[0].id);
  }
  window.addEventListener(
    'scroll',
    function () {
      if (!ticking) {
        ticking = true;
        requestAnimationFrame(updateActive);
      }
    },
    { passive: true },
  );
  updateActive();
})();
</script>
</body>
</html>
