name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lib:
    name: packages/lib (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/lib
      - run: npm test --workspace=packages/lib

  server:
    name: packages/server (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: packages/server
      - run: npm test --workspace=packages/server

  website-sync:
    name: website (derived files stay in sync with their source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate every derived file (md twins, schema copies, llms-full.txt)
        working-directory: website
        run: |
          python3 scripts/sync-md-twins.py
          python3 scripts/sync-schemas.py
          python3 scripts/gen-llms-full.py
      - name: Fail if regenerating any of them produced a diff
        run: |
          git diff --exit-code -- website/static/docs website/static/schemas website/static/llms-full.txt || {
            echo "::error::website/static/docs, website/static/schemas, or website/static/llms-full.txt is stale -- rerun the scripts in website/scripts/ and commit the result."
            exit 1
          }
