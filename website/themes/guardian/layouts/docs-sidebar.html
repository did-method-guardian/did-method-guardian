<!doctype html>
<html lang='en'>
<head>
<meta ht-include='fragments/head.html'></meta>
</head>
<body>
<header ht-include='fragments/header.html'></header>
<div class='layout'>
<aside ht-include='fragments/docs-nav.html'></aside>
<main class='content'>
<article class='prose' ht-content='markdown:page.content'></article>
</main>
<aside class='toc-sidebar'><p class='toc-label'>On this page</p><nav id='TableOfContents'></nav></aside>
</div>
<footer ht-include='fragments/footer.html'></footer>
<script>
(function () {
  // Marks the current page's own link active in the left page-nav (just
  // the highlight, no nesting -- a page's own heading count can be large
  // enough to push every other page out of view, confirmed live). The
  // heading outline itself goes in the right-hand "on this page" column
  // instead, the near-universal docs-site pattern (Stripe, MDN, Tailwind,
  // GitHub Docs, Vercel).
  var path = window.location.pathname;
  if (!path.endsWith('/')) path = path + '/';
  document.querySelectorAll('.sidenav > a.navlink').forEach(function (a) {
    var href = a.getAttribute('href');
    if (!href.endsWith('/')) href = href + '/';
    if (href === path) a.classList.add('active');
  });

  var article = document.querySelector('article.prose');
  var toc = document.getElementById('TableOfContents');
  var tocSidebar = document.querySelector('.toc-sidebar');
  if (!article || !toc) return;
  var headings = article.querySelectorAll('h2, h3');
  if (headings.length < 2) {
    if (tocSidebar) tocSidebar.hidden = true;
    return;
  }
  var list = document.createElement('ul');
  list.className = 'toc';
  headings.forEach(function (h) {
    if (!h.id) return;
    var li = document.createElement('li');
    var a = document.createElement('a');
    a.href = '#' + h.id;
    a.textContent = h.textContent.replace(/#$/, '').trim();
    li.appendChild(a);
    list.appendChild(li);
  });
  toc.appendChild(list);
})();
</script>
</body>
</html>
