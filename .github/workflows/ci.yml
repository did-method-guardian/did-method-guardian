name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lib:
    name: packages/lib (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build --workspace=packages/lib
      - run: npm test --workspace=packages/lib

  server:
    name: packages/server (typecheck + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
        working-directory: packages/server
      - run: npm test --workspace=packages/server
